version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
        - echo "MONGODB_URI=$MONGODB_URI" >> .env.local
        - echo "S3_REGION=$S3_REGION" >> .env.local
        - echo "S3_ACCESS_KEY_ID=$S3_ACCESS_KEY_ID" >> .env.local
        - echo "S3_SECRET_ACCESS_KEY=$S3_SECRET_ACCESS_KEY" >> .env.local
        - echo "S3_BUCKET_NAME=$S3_BUCKET_NAME" >> .env.local
        - echo "SMTP_HOST=$SMTP_HOST" >> .env.local
        - echo "SMTP_PORT=$SMTP_PORT" >> .env.local
        - echo "SMTP_USER=$SMTP_USER" >> .env.local
        - echo "SMTP_PASS=$SMTP_PASS" >> .env.local
        - echo "MAIL_FROM=$MAIL_FROM" >> .env.local
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
